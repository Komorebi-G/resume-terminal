name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 本分支 CI 构建 standard debug；mosh 原生库和 Maple 字体需另行构建。
      - name: Assemble debug APK
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Unit tests
        # app 带 flavor，没有 testDebugUnitTest 这个任务名，须单独点名，否则只跑到 terminal-* 两个库。
        run: ./gradlew testDebugUnitTest testStandardDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintStandardDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: resume-terminal-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
